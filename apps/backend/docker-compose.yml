version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kintai-postgres
    environment:
      POSTGRES_DB: kintai
      POSTGRES_USER: kintai
      POSTGRES_PASSWORD: kintai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kintai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/kintai
      DB_USER: kintai
      DB_PASSWORD: kintai_password
      APP_JWT_SECRET: your-secret-key-min-32-bytes-long!!
      APP_CORS_ORIGINS: http://localhost:4200
    depends_on:
      - postgres

volumes:
  postgres_data:
