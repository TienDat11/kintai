version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kintai
      POSTGRES_USER: kintai
      POSTGRES_PASSWORD: kintai_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./apps/backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kintai
      SPRING_DATASOURCE_USERNAME: kintai
      SPRING_DATASOURCE_PASSWORD: kintai_dev
    depends_on:
      - postgres

  frontend:
    build: ./apps/frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  pgdata: